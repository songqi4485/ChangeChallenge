[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yilan-ai-tutor"
version = "0.1.0"
description = "Evidence-grounded aviation science tutor prototype."
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "翼览无余团队"}]
dependencies = [
    "cryptography==49.0.0",
    "grpcio==1.82.1",
    "protobuf==7.35.1",
    "pypdf>=6.14.2",
    "websockets==15.0.1",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "httpx[http2]>=0.28.1",
    "sentence-transformers>=5.6.0",
    "structlog>=26.1.0",
    "jieba>=0.42.1",
    "faster-whisper>=1.0.3,<2",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "fastapi==0.115.6",
    "uvicorn==0.30.0",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0",
    "soundfile==0.12.1",
    "numpy>=1.26,<2",
    "librosa==0.10.2",
    "inflect==7.3.1",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "lightning==2.2.4",
    "matplotlib>=3.7",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "openai-whisper==20231117",
    "pyarrow==18.1.0",
    "pyworld==0.3.4",
    "x-transformers==2.11.24",
    "wget==3.2",
    "gdown>=5.1.0",
    "einops>=0.8",
    "tiktoken>=0.7",
    "unidecode>=1.3",
    "modelscope>=1.20",
    "huggingface_hub>=0.24",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

[project.scripts]
yilan = "app.cli:main"

[project.optional-dependencies]
memory-ai = [
    "sentence-transformers==5.6.0",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.82.1",
    "pytest==9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
markers = ["integration: requires network or model download"]
